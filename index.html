<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#07070c" />
<meta name="color-scheme" content="dark" />
<title>CineStream</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <div class="logo" onclick="goHome()">CINE<span>stream</span></div>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="setTab('movie',this)"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 7.5h4M3 12h18M3 16.5h4M17 7.5h4M17 16.5h4"/></svg>Filmes</button>
    <button class="nav-tab" onclick="setTab('tv',this)"><svg class="i" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="15" rx="2"/><path d="m17 2-5 5-5-5"/></svg>Séries</button>
    <button class="nav-tab" onclick="setTab('anime',this)"><svg class="i" viewBox="0 0 24 24"><path d="M3 5c6 1.5 12 1.5 18 0M5 9.5h14M7 6.5V21M17 6.5V21"/></svg>Animes</button>
  </div>
  <div class="nav-spacer"></div>
  <button class="fav-nav" id="fav-nav" onclick="showFavs()" title="Meus favoritos"><svg class="i" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg><span class="fav-nav-label">Favoritos</span><span class="fav-count" id="fav-count">0</span></button>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="q" placeholder="Buscar filmes, séries..." />
  </div>
</nav>

<div id="main-view">
  <div id="hero">
    <div id="hero-bg"></div>
    <div id="hero-vignette"></div>
    <div id="hero-content">
      <div class="hero-badge"><svg class="i" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>Em Alta</div>
      <div id="hero-title">Carregando...</div>
      <div id="hero-meta"></div>
      <div id="hero-desc"></div>
      <div class="hero-btns">
        <button class="btn-play" id="hero-play"><svg class="i" viewBox="0 0 24 24"><path d="M7 4v16l13-8z" fill="currentColor"/></svg>Assistir Agora</button>
        <button class="btn-info" id="hero-more"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>Mais Detalhes</button>
        <button class="btn-info btn-fav" id="hero-fav" data-fav-key=""><svg class="i" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg><span>Minha Lista</span></button>
      </div>
    </div>
  </div>

  <div class="pills" id="genre-pills"></div>
  <div class="providers" id="provider-pills"></div>

  <div class="section" id="fav-section" style="display:none">
    <div class="section-title"><span class="icon"><svg class="i" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg></span> Minha Lista</div>
    <div class="row" id="row-fav"></div>
  </div>
  <div class="section">
    <div class="section-title"><span class="icon"><svg class="i" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg></span> Populares</div>
    <div class="row" id="row-pop"></div>
  </div>
  <div class="section">
    <div class="section-title"><span class="icon"><svg class="i" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg></span> Mais Bem Avaliados</div>
    <div class="row" id="row-top"></div>
  </div>
  <div class="section">
    <div class="section-title"><span class="icon"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg></span> Lançamentos</div>
    <div class="row" id="row-new"></div>
  </div>
  <div id="provider-rows"></div>
</div>

<div id="fav-view">
  <div class="fav-head">
    <h3>Meus Favoritos</h3>
    <div class="fav-filters" id="fav-filters"></div>
  </div>
  <div id="fav-grid"></div>
</div>

<div id="search-view">
  <h3 id="search-head"></h3>
  <div id="search-grid"></div>
</div>

<div id="modal" onclick="modalBgClick(event)">
  <div id="modal-box">
    <div id="modal-head">
      <div id="modal-head-title"></div>
      <div class="modal-actions"><button id="fav-modal-btn" class="modal-icon-btn btn-fav-icon" data-fav-key="" title="Favoritar"><svg class="i" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg></button><button id="fs-btn" class="modal-icon-btn" onclick="toggleFullscreen()" title="Tela cheia"><svg class="i" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button><button id="modal-close-btn" onclick="closeModal()"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    </div>
    <div id="player-area"></div>
    <div id="modal-info"></div>
    <div id="ep-area" style="display:none">
      <h4>Temporadas e Episódios</h4>
      <select class="season-sel" id="season-sel" onchange="changeSeason()"></select>
      <div class="ep-grid" id="ep-grid"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="script.js"></script>
</body>
</html>
